# Dependabot configuration.
#
# Dependency surfaces in this repo:
#   - Python  : uv (pyproject.toml + uv.lock). requirements.txt is generated from
#               uv, so it is deliberately NOT managed here.
#   - Root JS : bun (package.json + bun.lock) for lint/build/release tooling.
#   - Docs    : npm (docs/package.json + docs/package-lock.json).
#   - Docker  : python base image in ./Dockerfile.
#   - CI      : GitHub Actions in .github/workflows.
#
# Minor and patch bumps are grouped per ecosystem to keep the PR list short;
# major bumps stay separate so each one can be reviewed on its own.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      js-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docusaurus core, preset, type aliases and the OpenAPI theme/plugin are
  # versioned in lockstep, so they are grouped together on purpose.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
