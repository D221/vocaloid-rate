name: Auto-merge Dependabot PRs

# Merges Dependabot pull requests once the CI workflow has passed for their
# head commit. Runs on workflow_run (not pull_request) so the job keeps a
# write-scoped GITHUB_TOKEN: pull_request runs from Dependabot get a
# read-only token and could not merge anything.
#
# This is a direct squash merge, not `gh pr merge --auto`. GitHub refuses to
# enable auto-merge unless the target branch has required status checks, and
# main is deliberately unprotected so a solo maintainer can push straight to
# it. CI already gated the exact commit being merged, and --match-head-commit
# rejects the merge if the branch moved in the meantime.
#
# Every update type is merged, majors included: CI runs Ruff, pytest, ESLint,
# Prettier, the frontend build and the Docker build on the PR, so a bump that
# breaks the app fails the run instead of reaching main. Only release-time
# tooling (bestzip, del-cli, docker/metadata-action) is exercised solely when a
# tag is pushed, so a broken major there surfaces at the next release.

on:
  workflow_run:
    workflows: ["CI & CD for Vocaloid Rate"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge the Dependabot PR
    # Only successful runs of the PR pipeline, never main pushes.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the Dependabot PR for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          number="$(
            gh pr list \
              --repo "$REPO" \
              --state open \
              --author "app/dependabot" \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"${HEAD_SHA}\") | .number"
          )"

          if [ -z "$number" ]; then
            echo "No open Dependabot PR for ${HEAD_SHA}, nothing to do."
            exit 0
          fi

          # Several Dependabot PRs touch package.json and bun.lock at once, so a
          # merge can land on a conflicted branch. Dependabot rebases and pushes
          # again, which starts a fresh CI run and a fresh attempt; there is
          # nothing to do until then, and no reason to fail this run.
          state="$(gh pr view "$number" --repo "$REPO" --json mergeable --jq .mergeable)"
          if [ "$state" = "CONFLICTING" ]; then
            echo "#${number} is conflicted; waiting for Dependabot to rebase it."
            exit 0
          fi

          echo "Merging #${number}"
          gh pr merge "$number" \
            --repo "$REPO" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"
